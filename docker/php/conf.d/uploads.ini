; Autorise les uploads volumineux (formulaires, médias, imports)
; Plafond calé sur le support "vidéo" d'ArticlesType (~390 Mo, cf. src/Form/Webapp/ArticlesType.php)
upload_max_filesize = 400M
post_max_size = 420M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_file_uploads = 20
