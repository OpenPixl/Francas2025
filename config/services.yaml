# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    article_directory: '%kernel.project_dir%/public/uploads/images/articles'
    user_directory: '%kernel.project_dir%/public/uploads/images/user'
    etablissement_directory: '%kernel.project_dir%/public/uploads/images/etablissements'
    config_directory: '%kernel.project_dir%/public/uploads/images/config'
    page_directory: '%kernel.project_dir%/public/uploads/images/pages'
    # Nouvelle arborescence des médias, rangés par propriétaire (établissement ou admin) puis par type
    etablissements_media_directory: '%kernel.project_dir%/public/uploads/etablissements'
    admins_media_directory: '%kernel.project_dir%/public/uploads/admins'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Résolution des chemins de stockage des médias (établissements/articles)
    App\Service\MediaPathResolver:
        arguments:
            $etablissementsBaseDir: '%etablissements_media_directory%'
            $adminsBaseDir: '%admins_media_directory%'

    # Migration ponctuelle vers la nouvelle arborescence imbriquée (app:media:migrate-to-nested-storage)
    App\Command\MigrateMediaToNestedStorageCommand:
        arguments:
            $etablissementDirectory: '%etablissement_directory%'
            $articleDirectory: '%article_directory%'

    # Parametrage bunbdle Fos ELASTICA sur Etablissement
    FOS\ElasticaBundle\Finder\FinderInterface $etablissementFinder:
        alias: fos_elastica.finder.etablissement
    App\Controller\Admin\EtablissementController:
        tags: [ 'controller.service_arguments' ]
        public: true
        arguments:
            - '@fos_elastica.finder.etablissement'
            - '@App\Service\MediaPathResolver'

    # Parametrage bunbdle Fos ELASTICA sur Article
    FOS\ElasticaBundle\Finder\FinderInterface $articleFinder:
        alias: fos_elastica.finder.article
    App\Controller\Webapp\ArticleController:
        tags: [ 'controller.service_arguments' ]
        public: true
        arguments:
            - '@fos_elastica.finder.article'
            - '@App\Service\MediaPathResolver'
