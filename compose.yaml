services:

  php:
    build:
      context: .
      args:
        - SYMFONY_VERSION=${SYMFONY_VERSION:-8.0.*}
        - PHP_VERSION=${PHP_VERSION:-8.4}
        - GIT_USER_EMAIL=${GIT_USER_EMAIL:-youremail@email.com}
        - GIT_USER_NAME=${GIT_USER_NAME:-yourname}
    container_name: francascc2025_php
    restart: unless-stopped
    ports:
      - "84:80"
    #  - "443:443"
    #  - "443:443/udp"
    volumes:
      - ./:/app
    environment:
      - SERVER_NAME=:80
      # Force l'environnement de production : sans ça, .env / .env.local (APP_ENV)
      # font tourner le kernel en mode dev+debug (profiler, logs debug, revalidation
      # container/Twig à chaque requête ET chaque sous-requête render(controller())).
      - APP_ENV=prod
      - APP_DEBUG=0
    depends_on:
      - db
    networks:
      - francascc2025

  # Base de données MariaDB
  db:
    image: mariadb:10.11.2
    container_name: francascc2025_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app}
      - MYSQL_USER=${MYSQL_USER:-app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-!ChangeMe!}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
    # Port publié sur l'hôte pour la supervision depuis l'IDE (hôte 3307 -> conteneur 3306).
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Configuration MariaDB versionnée dans le projet. Montée comme fichier isolé
      # (et non le dossier entier) pour ne pas masquer le docker.cnf fourni par l'image.
      - ./docker/mariadb/conf.d/francas2025.cnf:/etc/mysql/conf.d/francas2025.cnf:ro
    networks:
      - francascc2025

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
    container_name: francascc2025_search
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9201:9200"
      - "9301:9300"
    restart: always
    networks:
      - francascc2025

volumes:
  ###> doctrine/doctrine-bundle ###
  db_data:
  ###< doctrine/doctrine-bundle ###
  esdata:

networks:
  francascc2025:
    external: true
