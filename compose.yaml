services:

  php:
    build:
      context: .
      args:
        - SYMFONY_VERSION=${SYMFONY_VERSION:-8.0.*}
        - PHP_VERSION=${PHP_VERSION:-8.4}
        - GIT_USER_EMAIL=${GIT_USER_EMAIL:-youremail@email.com}
        - GIT_USER_NAME=${GIT_USER_NAME:-yourname}
    container_name: francascc2025_php
    restart: unless-stopped
    ports:
      - "84:80"
    #  - "443:443"
    #  - "443:443/udp"
    volumes:
      - ./:/app
    environment:
      - SERVER_NAME=:80
    depends_on:
      - db
    networks:
      - francascc2025

  # Base de données MariaDB
  db:
    image: mariadb:10.11.2
    container_name: francascc2025_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app}
      - MYSQL_USER=${MYSQL_USER:-app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-!ChangeMe!}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - francascc2025

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
    container_name: francascc2025_search
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9201:9200"
      - "9301:9300"
    restart: always
    networks:
      - francascc2025

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
  ###< doctrine/doctrine-bundle ###
  esdata:

networks:
  francascc2025:
    external: true
